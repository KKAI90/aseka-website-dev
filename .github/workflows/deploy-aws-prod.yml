name: Deploy to AWS (prod)

on:
  push:
    branches: [aseka-main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: aws-prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Build chạy hoàn toàn ở đây (CI) — KHÔNG build trên EC2 (RAM t4g.micro thấp,
      # dễ OOM). EC2 chỉ nhận artifact đã build sẵn rồi restart PM2.
      - name: Install & build
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
        run: |
          npm ci
          npx prisma generate
          npm run build

