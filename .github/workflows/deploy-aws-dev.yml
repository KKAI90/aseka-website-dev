name: Deploy to AWS (dev)

on:
  push:
    branches: [aseka-dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build
        run: |
          npm ci
          npx prisma generate
          npm run build

